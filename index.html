*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));transition:background .3s,color .3s}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 10px) 18px 8px;border-bottom:1px solid var(--line)}

.row{display:flex;align-items:center;gap:10px}

.tl{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}

.btn{border:0;background:var(--chip);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}

#mapwrap{position:relative;margin:8px -16px 0;height:calc(100vh - 230px);min-height:380px;background:var(--sea);overflow:hidden;touch-action:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#map{width:100%;height:100%;display:block;user-select:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;transform:translateY(105%);transition:transform .25s ease;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.15);padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}

try{localStorage.removeItem('wx')}catch(e){}
// Safety net: if anything breaks, show the error and a reset button instead of a blank screen.
function resetApp(){
  try{localStorage.removeItem('tab')}catch(e){}
  var done=function(){location.replace(location.pathname+'?r='+Date.now())};
  var jobs=[];
  if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
  if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
  Promise.all(jobs).then(done,done);
}
window.onerror=function(msg,src,line){
  var el=document.getElementById('app');
  if(el)el.innerHTML='<div class="card" style="margin-top:20px"><h3>Something went wrong</h3><p class="small">'+String(msg).replace(/</g,'&lt;')+' (line '+line+')</p><p><button class="btn pri" onclick="resetApp()">Reset &amp; reload</button></p><p class="mut small">Your notes and photos are kept. Screenshot this and send it to Claude if it keeps happening.</p></div>';
};
</script>

/* ---------- sun (NOAA approximation, offline) ---------- */
function sunTimes(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const n=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/864e5),g=2*Math.PI/365*(n-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const r=Math.PI/180,lat=LAT*r;
  const ha=Math.acos(Math.cos(90.833*r)/(Math.cos(lat)*Math.cos(dec))-Math.tan(lat)*Math.tan(dec))/r;
  const f=x=>((x+TZH*60)%1440+1440)%1440;
  return {rise:f(720-4*(LON+ha)-eq),set:f(720-4*(LON-ha)-eq)};
}
function fmt(min){min=Math.round(min);let h=Math.floor(min/60)%24,m=min%60;const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+ap}
function dur(min){min=Math.max(0,Math.round(min));const h=Math.floor(min/60),m=min%60;return h?`${h}h ${m}m`:`${m} min`}

/* ---------- distance / travel ---------- */
function km(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function travel(p,from){
  if(p.lat==null)return '';
  const road=km(from||HOTEL,p)*1.35;
  if(road<1.6)return `≈${Math.max(2,Math.round(road/4.8*60))} min walk`;
  return `≈${Math.round(road/45*60+3+(p.dirt?8:0))} min drive`;
}

function tideChart(td){
  const pts=td.filter(t=>t.min!=null);if(pts.length<2)return'';
  const W=300,Hh=70,min=Math.min(...pts.map(p=>p.ft))-0.5,max=Math.max(...pts.map(p=>p.ft))+0.5;
  const y=f=>Hh-8-(f-min)/(max-min)*(Hh-20),x=m=>m/1440*W;
  let d='';for(let m=0;m<=1440;m+=10){let a=null,b=null;for(const p of pts){if(p.min<=m)a=p;if(p.min>m&&!b)b=p}
    let f;if(a&&b){const k=(m-a.min)/(b.min-a.min);f=a.ft+(b.ft-a.ft)*(1-Math.cos(Math.PI*k))/2}else f=(a||b).ft;d+=(m?'L':'M')+x(m).toFixed(1)+','+y(f).toFixed(1)}

function initMapGestures(){

  else if(a==='zin'||a==='zout'){const b=$('#map').getBoundingClientRect();$('#mapwrap')._zoom(a==='zin'?0.6:1.6,b.left+b.width/2,b.top+b.height/2)}
  else if(a==='view')setView(k);
  else if(a==='gps'){LS.set('gpsOk',true);startGps(true)}
  else if(a==='save'){['tides','music','resv','notes'].forEach(x=>LS.set(x,$('#e-'+x).value));toast('Saved')}
  else if(a==='reset'){if(confirm('Replace tides, music and reservations with the built-in versions?')){['tides','music','resv'].forEach(LS.del);render();toast('Reset')}}
  else if(a==='wx')refreshWx(true);
  else if(a==='theme')$('#themeBtn').click();
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.act==='memo'){const m=LS.get('memo',{});m[el.dataset.k]=el.value;LS.set('memo',m)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.act==='photo')addPhotos(el.files,el.dataset.k)});

/* ================= photos (IndexedDB) ================= */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open('ts-trip',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true}).createIndex('day','day');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function addPhotos(files,day){
  for(const f of files){try{const url=await shrink(f);const d=await db();await new Promise((res,rej)=>{const tx=d.transaction('photos','readwrite');tx.objectStore('photos').add({day,data:url,t:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){toast('Couldn’t save that photo')}}
  loadPhotos(day);toast('Photo saved');
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82))};img.onerror=rej;img.src=u})}
async function loadPhotos(day){
  const el=document.getElementById('ph-'+day.replace('/','-'));if(!el)return;
  try{const d=await db();const rows=await new Promise(res=>{const out=[];d.transaction('photos').objectStore('photos').index('day').openCursor(IDBKeyRange.only(day)).onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue()}else res(out)}});
    el.innerHTML=rows.map(r=>`<img src="${r.data}" alt="" data-pid="${r.id}">`).join('');
    el.querySelectorAll('img').forEach(im=>im.onclick=()=>{const w=window.open();if(w)w.document.write(`<body style="margin:0;background:#000"><img src="${im.src}" style="width:100%">`);else if(confirm('Delete this photo?'))delPhoto(+im.dataset.pid,day)});
  }catch(e){}
}
async function delPhoto(id,day){const d=await db();d.transaction('photos','readwrite').objectStore('photos').delete(id);setTimeout(()=>loadPhotos(day),200)}

/* ================= weather & offline ================= */
async function refreshWx(manual){
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,wind_speed_10m_max,uv_index_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FMazatlan&forecast_days=16`);
    if(!r.ok)throw 0;const j=await r.json();LS.set('wx3',{daily:j.daily,saved:Date.now()});if(manual)toast('Forecast updated');if(state.tab==='today')render()}
  catch(e){if(manual)toast('No connection. Showing the saved forecast')}
}
async function offlineStatus(){const el=$('#offl');if(!el)return;let t='';
  if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistration();t=r&&r.active?'✅ Saved for offline use. The whole app works without signal.':'⏳ Not saved yet. Keep it open for a few seconds on Wi-Fi.'}else t='This browser can’t save the app for offline use.';el.textContent=t}
function netBadge(){const on=navigator.onLine;$('#net').textContent=on?'online':'offline';$('#net').classList.toggle('on',on)}
addEventListener('online',()=>{netBadge();refreshWx()});addEventListener('offline',netBadge);

/* live updates: countdown + sunset theme */
setInterval(()=>{applyTheme();if(state.tab==='today'){const d=DAYS.find(x=>x.k===state.day);const el=$('#cd');if(el)el.innerHTML=countdownHtml(d,PLAN[d.k])}},30000);

applyTheme();netBadge();render();
if(navigator.onLine){const wx=LS.get('wx3',null);if(!wx||Date.now()-wx.saved>3*3600e3)refreshWx()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
