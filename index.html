<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5f0" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Todos Santos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Todos Santos</title>
<style>
:root{
  --bg:#f8f5f0;--bg2:#efeae2;--ink:#1b1c1e;--mut:#6c6f73;--line:#e3ddd3;--chip:#ebe5dc;
  --acc:#ef5a3c;--sea:#168f9c;--good:#1f9d5a;--warn:#d9822b;--bad:#d2452b;
  --land:#efe9df;--seacol:#bfe0ea;--hdr:rgba(248,245,240,.93);--navbg:rgba(250,247,243,.96);
  --c-eat:#ef5a3c;--c-beach:#168f9c;--c-do:#7b5bd6;--c-night:#3b4cc0;--c-info:#5f6670;
  --t-eat:rgba(239,90,60,.12);--t-beach:rgba(22,143,156,.12);--t-do:rgba(123,91,214,.12);--t-night:rgba(59,76,192,.12);--t-info:rgba(95,102,112,.12);
}
html[data-theme=dark]{
  --bg:#0e1113;--bg2:#15191c;--ink:#eceae6;--mut:#979b9f;--line:#23282c;--chip:#1d2226;
  --acc:#ff7356;--sea:#4cc6d2;--good:#4fd18a;--warn:#f0a44f;--bad:#ff7a63;
  --land:#1a1e21;--seacol:#122a31;--hdr:rgba(14,17,19,.92);--navbg:rgba(20,24,27,.95);
  --c-eat:#ff7356;--c-beach:#4cc6d2;--c-do:#a58cf0;--c-night:#8a98ff;--c-info:#a3a9b0;
  --t-eat:rgba(255,115,86,.16);--t-beach:rgba(76,198,210,.16);--t-do:rgba(165,140,240,.16);--t-night:rgba(138,152,255,.16);--t-info:rgba(163,169,176,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--hdr);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:2px;position:relative}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:700;color:var(--mut);border-radius:8px;position:relative;z-index:1;cursor:pointer;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:left .25s cubic-bezier(.3,1.4,.5,1),width .25s}
.ib{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:16px}
/* hero weather */
.hero{position:relative;color:#fff;padding:10px 14px 8px;overflow:hidden;transition:background 1.2s}
.hgrid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hleft{display:flex;align-items:center;gap:6px;min-width:0}
.tlbl{font-size:11px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.clock{text-align:center;line-height:1}
.clock b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock span{font-size:11px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.hsub{font-size:12.5px;opacity:.92;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-bday] {--acc:#c8921a}
html[data-bday] .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,215,120,.35) 50%,transparent 70%);background-size:250% 100%;animation:shimmer 6s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}
.notecard{margin:12px 16px 0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,#f8e7c2,#f3c9a8);color:#3b2a14;cursor:pointer;position:relative;overflow:hidden}
.notecard b{font-size:16px}.notecard .small{opacity:.8}
.notecard.locked{background:linear-gradient(135deg,#ece6dd,#e2dbd0);color:var(--ink)}
html[data-theme=dark] .notecard.locked{background:linear-gradient(135deg,#22272b,#1b1f22);color:var(--ink)}
.letter{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.55;white-space:pre-wrap;padding:6px 2px}
.sky{padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(27,42,92,.07),transparent)}
.sky .moon{font-size:34px;line-height:1}
.sky .pl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sky .pl span{font-size:12.5px;font-weight:700;background:var(--chip);padding:4px 9px;border-radius:99px}
.tipbox{padding:12px 16px;border-bottom:1px solid var(--line)}
.tipbox input{width:100%;font:inherit;font-size:22px;font-weight:700;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
.tipgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tipgrid div{background:var(--bg2);border-radius:12px;padding:10px 6px;text-align:center}
.tipgrid b{display:block;font-size:17px}.tipgrid span{font-size:12px;color:var(--mut)}
.cust{padding:9px 16px;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;gap:10px}
.cust b{min-width:118px;flex:none}
.hrow1{display:flex;align-items:center;gap:8px}
.hero .wxi{width:38px;height:38px;flex:none}
.hero .temp{font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1}
.hmeta{flex:1;min-width:0;line-height:1.25}
.hero .cond{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .sub{font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hchips{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:none}
.hchip{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:99px;white-space:nowrap}
.hourly{display:flex;gap:14px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.22);margin-top:8px}
.hourly::-webkit-scrollbar{display:none}
.hourly div{flex:none;text-align:center;font-size:11.5px;min-width:30px;opacity:.95}
.hourly b{display:block;font-size:13.5px;font-weight:700}
.hourly svg{width:20px;height:20px;display:block;margin:2px auto}
.days{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:10px 12px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;border:0;background:none;padding:8px 10px 10px;font-size:14px;font-weight:600;color:var(--mut);position:relative;cursor:pointer}
.days button.on{color:var(--ink)}
.days button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px;background:var(--acc);animation:grow .3s ease}
.days .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:4px;vertical-align:middle}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
/* sections & rows */
main{max-width:720px;margin:0 auto}
.sec{padding:18px 16px 4px}
.sec h2{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sec .hint{font-size:13.5px;color:var(--mut);margin:0 0 4px}
.rows{border-top:1px solid var(--line)}
.r{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;animation:fadeUp .35s ease both;transition:background .15s}
.r:active{background:var(--bg2)}
.r .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.r .ic svg{width:21px;height:21px}
.r .tx{flex:1;min-width:0}
.r .nm{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .ln{font-size:13.5px;color:var(--mut);margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.r .rt{text-align:right;font-size:13px;color:var(--mut);flex:none}
.qs{border:0;background:none;font-size:20px;color:var(--mut);padding:6px;cursor:pointer;flex:none;line-height:1}
.qs.on{color:#f5b400}
.qs.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.r .why{font-size:13.5px;color:var(--ink);opacity:.85;margin-top:2px}
.st{font-weight:600}
.st.open{color:var(--good)}.st.soon{color:var(--warn)}.st.closed{color:var(--bad)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px;box-shadow:0 0 0 0 rgba(31,157,90,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,90,.45)}70%{box-shadow:0 0 0 7px rgba(31,157,90,0)}100%{box-shadow:0 0 0 0 rgba(31,157,90,0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:6px;margin-right:4px;vertical-align:1px;background:var(--chip);color:var(--mut)}
.tag.q{color:var(--good)}.tag.w{color:var(--bad)}.tag.m{color:var(--sea)}.tag.s{color:var(--warn)}
.filters{display:flex;gap:6px;padding:10px 16px 2px;overflow-x:auto;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pinrow{border-left:3px solid var(--acc);background:var(--bg2)}
.note{padding:10px 16px;font-size:13.5px;color:var(--mut);border-bottom:1px solid var(--line)}
.kv{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.kv b{min-width:64px}
.btn{border:0;background:var(--chip);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff}
.btn.on{background:var(--sea);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea,input[type=text]{width:100%;font:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg2)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
label.l{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
.mut{color:var(--mut)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
/* tides */
.tide{padding:6px 16px 12px;border-bottom:1px solid var(--line)}
.tide svg{width:100%;height:84px;display:block}
.tide .path{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tide .wave{animation:wave 4s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(1.5px)}}
.tlist{display:flex;justify-content:space-between;font-size:13px;margin-top:4px}
.tlist div{text-align:center}.tlist b{display:block;font-size:14px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--navbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:10.5px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;transition:color .2s}
nav button svg{width:24px;height:24px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
nav button.on{color:var(--acc)}
nav button.on svg{transform:translateY(-2px) scale(1.08)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2.5px;border-radius:0 0 3px 3px;background:var(--acc);animation:grow .3s ease}
/* map */
.mapwrap{position:fixed;left:0;right:0;top:var(--toph,56px);bottom:calc(57px + env(safe-area-inset-bottom));z-index:10}
.tmap{position:absolute;inset:0;overflow:hidden;background:var(--land);touch-action:none;user-select:none;-webkit-user-select:none}
.tmap .base,.tmap .tiles,.tmap .pins{position:absolute;inset:0}
.tmap .base{width:100%;height:100%}
.tile{position:absolute;left:0;top:0;opacity:0;transition:opacity .3s;pointer-events:none;-webkit-user-drag:none;transform-origin:0 0}
.tile.ok{opacity:1}.tile.bad{display:none}
html[data-theme=dark] .tile.fb{filter:invert(.92) hue-rotate(180deg) brightness(.9) contrast(.9)}
.pin{position:absolute;left:0;top:0;cursor:pointer}
.pin .pb{position:absolute;left:-15px;top:-38px;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff;animation:drop .5s cubic-bezier(.3,1.5,.6,1) both}
.pin .pb svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin .lbl{position:absolute;left:12px;top:-34px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 3px var(--bg);pointer-events:none}
.pin.sel .pb{transform:rotate(-45deg) scale(1.25);transition:transform .2s}
.pin .fav{position:absolute;left:6px;top:-44px;font-size:12px}
@keyframes drop{0%{opacity:0;transform:translateY(-30px) rotate(-45deg)}60%{opacity:1}100%{transform:rotate(-45deg)}}
.me{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 0 0 0 rgba(66,133,244,.4);animation:mepulse 2s infinite}
@keyframes mepulse{0%{box-shadow:0 0 0 0 rgba(66,133,244,.45)}70%{box-shadow:0 0 0 14px rgba(66,133,244,0)}100%{box-shadow:0 0 0 0 rgba(66,133,244,0)}}
.mctl{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:8px;z-index:5}
.mctl button{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:20px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.mctl button.g{font-size:13px;font-weight:800;color:#4285f4}
.mtop{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;z-index:5;overflow-x:auto;scrollbar-width:none}
.mtop button,.mtop .wxp{flex:none;border:0;background:var(--bg);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.mtop button.on{background:var(--ink);color:var(--bg)}
.mtop svg{width:18px;height:18px}
.attr{position:absolute;left:6px;bottom:4px;font-size:10px;color:#555;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px;z-index:5}
.gwrap{position:absolute;inset:0;z-index:8;background:var(--bg);display:none}
.gwrap.on{display:block}
.gwrap iframe{width:100%;height:100%;border:0}
.gwrap .back{position:absolute;left:12px;top:12px;z-index:2}
.gfull{position:absolute;left:0;right:0;top:62px;bottom:0;z-index:4;background:var(--land)}
.mapwrap .mtop{top:0;left:0;right:0;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.mapwrap .mtop button,.mapwrap .mtop .wxp{box-shadow:none;border:1px solid var(--line)}
.gfull iframe{width:100%;height:100%;border:0;display:block}
.carousel{position:absolute;left:0;right:0;bottom:14px;z-index:6;display:flex;gap:10px;overflow-x:auto;padding:0 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card{flex:none;width:78%;max-width:300px;scroll-snap-align:center;background:var(--bg);border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;border:2px solid transparent;transition:border-color .2s,transform .2s}
.card.on{border-color:var(--acc);transform:translateY(-3px)}
.card .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.card .ic svg{width:19px;height:19px}
.card .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ln{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .more{border:0;background:var(--chip);border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer;flex:none}
.offtag{position:absolute;left:12px;bottom:118px;z-index:6;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px}
.r:has(+ .daypick){border-bottom:0;padding-bottom:6px}
.daypick{display:flex;gap:6px;padding:0 16px 12px 68px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.daypick button,.sdays button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;transition:all .2s}
.daypick button.on,.sdays button.on{background:var(--acc);border-color:var(--acc);color:#fff;animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.sdays{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dayhead{display:flex;align-items:baseline;gap:8px;padding:14px 16px 6px}
.dayhead b{font-size:16px}.dayhead span{color:var(--mut);font-size:13px}
.it{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);animation:fadeUp .3s ease both;background:var(--bg)}
.it .tm{width:74px;flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:6px 7px;font-size:13px;font-weight:700;color:var(--ink)}
.it .tm::placeholder{color:var(--mut);font-weight:500}
.it .nm{font-weight:700;font-size:15.5px}
.it .ln{font-size:12.5px;color:var(--mut)}
.it .ib2{border:0;background:none;color:var(--mut);font-size:17px;padding:5px 6px;cursor:pointer;flex:none}
.it.note .nm{font-weight:600}
.it.flash{animation:flash .9s ease}
@keyframes flash{0%{background:rgba(239,90,60,.18)}100%{background:var(--bg)}}
.add{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.add select{width:100%;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
.empty{padding:22px 16px;text-align:center;color:var(--mut);border-bottom:1px solid var(--line)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
/* sheet */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility .32s;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#sheet.open{transform:none;visibility:visible}
#sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
#sheet h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
#sheet .hl{border-top:1px solid var(--line);margin:14px -18px 0;padding:12px 18px 0}
.starbtn.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:none}}
.burst{position:fixed;pointer-events:none;z-index:60;width:6px;height:6px;border-radius:50%;animation:burst .6s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

  const bm=b.match(/(am|pm)/i);const e=pt(b);let s=pt(a,bm?bm[1]:null);if(s==null||e==null)return null;
  let end=e===0?1440:e;if(s>end&&!/(am|pm)/i.test(a))s-=720;return [s,end];

/* ================= night sky (offline, low-precision) ================= */
const SKY=(()=>{
  const RAD=Math.PI/180,DEG=180/Math.PI;
  const jd=ms=>ms/864e5+2440587.5;
  const norm=a=>((a%360)+360)%360;
  // JPL approximate Keplerian elements (J2000, valid 1800–2050): a,e,I,L,peri,node + rates per century
  const EL={
    Mercury:[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593, 0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081],
    Venus:[0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255, 0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418],
    Earth:[1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0, 0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0],
    Mars:[1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891, 0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343],
    Jupiter:[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909, -0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106],
    Saturn:[9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448, -0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794]
  };
  function helio(name,T){
    const e0=EL[name];const a=e0[0]+e0[6]*T,e=e0[1]+e0[7]*T,I=(e0[2]+e0[8]*T)*RAD,L=e0[3]+e0[9]*T,w=e0[4]+e0[10]*T,O=e0[5]+e0[11]*T;
    const om=(w-O)*RAD,M=norm(L-w)*RAD,On=O*RAD;
    let E=M+e*Math.sin(M);for(let k=0;k<6;k++)E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
    const xp=a*(Math.cos(E)-e),yp=a*Math.sqrt(1-e*e)*Math.sin(E);
    const x=(Math.cos(om)*Math.cos(On)-Math.sin(om)*Math.sin(On)*Math.cos(I))*xp+(-Math.sin(om)*Math.cos(On)-Math.cos(om)*Math.sin(On)*Math.cos(I))*yp;
    const y=(Math.cos(om)*Math.sin(On)+Math.sin(om)*Math.cos(On)*Math.cos(I))*xp+(-Math.sin(om)*Math.sin(On)+Math.cos(om)*Math.cos(On)*Math.cos(I))*yp;
    const z=Math.sin(om)*Math.sin(I)*xp+Math.cos(om)*Math.sin(I)*yp;
    return [x,y,z];
  }
  const OBL=23.43928*RAD;
  function eclToEq(x,y,z){const ye=y*Math.cos(OBL)-z*Math.sin(OBL),ze=y*Math.sin(OBL)+z*Math.cos(OBL);return {ra:Math.atan2(ye,x),dec:Math.atan2(ze,Math.hypot(x,ye)),dist:Math.hypot(x,y,z)}}
  function planetEq(name,ms){const T=(jd(ms)-2451545)/36525;const p=helio(name,T),E=helio('Earth',T);return eclToEq(p[0]-E[0],p[1]-E[1],p[2]-E[2])}
  function sunEq(ms){const T=(jd(ms)-2451545)/36525;const E=helio('Earth',T);return eclToEq(-E[0],-E[1],-E[2])}
  function moonEq(ms){ // low precision (approx. 0.3°)
    const d=jd(ms)-2451545;
    const L=norm(218.316+13.176396*d),M=norm(134.963+13.064993*d)*RAD,F=norm(93.272+13.229350*d)*RAD,D=norm(297.850+12.190749*d)*RAD,Ms=norm(357.529+0.98560028*d)*RAD;
    const lon=(L+6.289*Math.sin(M)+1.274*Math.sin(2*D-M)+0.658*Math.sin(2*D)+0.214*Math.sin(2*M)-0.186*Math.sin(Ms)-0.114*Math.sin(2*F))*RAD;
    const lat=(5.128*Math.sin(F))*RAD;
    const x=Math.cos(lat)*Math.cos(lon),y=Math.cos(lat)*Math.sin(lon),z=Math.sin(lat);
    return eclToEq(x,y,z);
  }
  function altAz(eq,ms,lat,lon){
    const d=jd(ms)-2451545;const gmst=norm(280.46061837+360.98564736629*d)*RAD;const H=gmst+lon*RAD-eq.ra;const la=lat*RAD;
    const alt=Math.asin(Math.sin(la)*Math.sin(eq.dec)+Math.cos(la)*Math.cos(eq.dec)*Math.cos(H));
    const az=Math.atan2(-Math.sin(H)*Math.cos(eq.dec),Math.cos(la)*Math.sin(eq.dec)-Math.sin(la)*Math.cos(eq.dec)*Math.cos(H));
    return {alt:alt*DEG,az:norm(az*DEG)};
  }
  function moonPhase(ms){
    const syn=29.530588853,ref=Date.UTC(2000,0,6,18,14);const age=((ms-ref)/864e5%syn+syn)%syn;const f=age/syn;
    const illum=(1-Math.cos(2*Math.PI*f))/2;
    const names=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
    const emo=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];const i=Math.round(f*8)%8;
    return {age,illum,name:names[i],emoji:emo[i]};
  }
  const dir=az=>['N','NE','E','SE','S','SW','W','NW'][Math.round(az/45)%8];
  // tonight for a trip date (local UTC-7): scan 3 pm → 9 am next day
  function tonight(dateStr,lat,lon,tz){
    const [y,m,d]=dateStr.split('-').map(Number);const t0=Date.UTC(y,m-1,d,15-tz);// 15:00 local
    const step=10*60e3,N=18*6;let moonRise=null,moonSet=null,darkStart=null,darkEnd=null,prevM=null,prevS=null;
    const samples=[];
    for(let i=0;i<=N;i++){const ms=t0+i*step;const s=altAz(sunEq(ms),ms,lat,lon).alt,mo=altAz(moonEq(ms),ms,lat,lon).alt;
      if(prevM!=null){if(prevM<0.125&&mo>=0.125&&moonRise==null)moonRise=ms;if(prevM>=0.125&&mo<0.125&&moonSet==null)moonSet=ms}
      if(prevS!=null){if(prevS>=-18&&s<-18&&darkStart==null)darkStart=ms;if(prevS<-18&&s>=-18&&darkEnd==null&&darkStart)darkEnd=ms}
      samples.push({ms,s,mo});prevM=mo;prevS=s}
    // moonless dark window
    let mdStart=null,mdEnd=null,best=0,cur=null;
    for(const p of samples){const ok=p.s<-18&&p.mo<0;if(ok&&cur==null)cur=p.ms;if((!ok||p===samples[samples.length-1])&&cur!=null){const len=p.ms-cur;if(len>best){best=len;mdStart=cur;mdEnd=p.ms}cur=null}}
    const moonUpAtDark=darkStart?altAz(moonEq(darkStart+30*60e3),darkStart+30*60e3,lat,lon).alt>0:false;
    // planets: best altitude between dark start and 1 am
    const until=Date.UTC(y,m-1,d,25-tz);const planets=[];
    for(const name of ['Venus','Mars','Jupiter','Saturn','Mercury']){
      let bestAlt=-90,bestMs=null,firstUp=null;
      for(let ms=(darkStart||t0+3*3600e3)-60*60e3;ms<=until;ms+=15*60e3){const a=altAz(planetEq(name,ms),ms,lat,lon);if(a.alt>10&&firstUp==null)firstUp={ms,az:a.az};if(a.alt>bestAlt){bestAlt=a.alt;bestMs=ms}}
      if(bestAlt>12){const a=altAz(planetEq(name,bestMs),bestMs,lat,lon);planets.push({name,alt:Math.round(bestAlt),az:a.az,dir:dir(a.az),best:bestMs,firstUp})}
    }
    const mp=moonPhase(darkStart||t0+4*3600e3);
    return {moonRise,moonSet,darkStart,darkEnd,mdStart,mdEnd,moonUpAtDark,planets,phase:mp};
  }
  return {tonight,moonPhase,planetEq,altAz,sunEq,moonEq,dir};
})();

  let data;try{data=JSON.parse(b64d(m[1]))}catch(e){toast('That plan link looks broken');return}
  history.replaceState(null,'',location.pathname);
  const n=Object.values(data.itin||{}).reduce((a,x)=>a+(x?x.length:0),0);
  $('#sheet').innerHTML=`<div class="grab"></div><h3>Load shared plan?</h3><p>This link has <b>${n} itinerary item${n===1?'':'s'}</b> and ${(data.favs||[]).length} saved places.</p><div class="actions"><button class="btn pri" id="impReplace">Replace mine</button><button class="btn" id="impMerge">Merge with mine</button><button class="btn" id="impNo">Cancel</button></div><p class="mut small">Replace makes your itinerary match exactly. Merge keeps yours and adds anything new.</p>`;
  $('#sheet').classList.add('open');$('#scrim').classList.add('open');
  if(data.n&&!noteAuthor())LS.set('bnoteIn',data.n);
  const done=msg=>{saveItin();LS.set('favs',[...favs]);LS.set('favgigs',[...favGigs]);closeSheet();state.tab='info';state.mode='list';render();confettiSmall();toast(msg)};
  $('#impReplace').onclick=()=>{for(const k in ITIN)delete ITIN[k];Object.assign(ITIN,data.itin||{});(data.favs||[]).forEach(f=>favs.add(f));(data.gigs||[]).forEach(g=>favGigs.add(g));done('Plan loaded')};
  $('#impMerge').onclick=()=>{for(const k in (data.itin||{})){const cur=dayItems(k);for(const it of data.itin[k]){const dup=cur.some(x=>x.k===it.k||(it.id&&x.id===it.id)||(it.gig&&x.gig===it.gig)||(it.text&&!it.id&&!it.gig&&x.text===it.text));if(!dup)cur.push(it)}}(data.favs||[]).forEach(f=>favs.add(f));(data.gigs||[]).forEach(g=>favGigs.add(g));done('Plans merged')};
  $('#impNo').onclick=closeSheet;
}
function confettiSmall(){try{confetti()}catch(e){}}

/* ================= confetti ================= */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#ef5a3c','#f5b400','#168f9c','#7b5bd6','#ff8fb1'];const ps=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();const step=t=>{x.clearRect(0,0,innerWidth,innerHeight);for(const p of ps){p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-(t-t0)/2400);x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}if(t-t0<2400)requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight)};requestAnimationFrame(step);
}

/* ================= photos ================= */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open('ts-trip',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true}).createIndex('day','day');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function addPhotos(files,day){for(const f of files){try{const url=await shrink(f);const d=await db();await new Promise((res,rej)=>{const tx=d.transaction('photos','readwrite');tx.objectStore('photos').add({day,data:url,t:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){toast('Couldn’t save that photo')}}loadPhotos(day);toast('Photo saved')}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82))};img.onerror=rej;img.src=u})}
async function loadPhotos(day){const el=document.getElementById('ph-'+day.replace('/','-'));if(!el)return;try{const d=await db();const rows=await new Promise(res=>{const out=[];d.transaction('photos').objectStore('photos').index('day').openCursor(IDBKeyRange.only(day)).onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue()}else res(out)}});el.innerHTML=rows.map(r=>`<img src="${r.data}" alt="" data-pid="${r.id}">`).join('');el.querySelectorAll('img').forEach(im=>im.onclick=()=>{if(confirm('Delete this photo?'))delPhoto(+im.dataset.pid,day)})}catch(e){}}
async function delPhoto(id,day){const d=await db();d.transaction('photos','readwrite').objectStore('photos').delete(id);setTimeout(()=>loadPhotos(day),200)}

/* ================= weather & offline ================= */
async function refreshWx(manual){
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,wind_speed_10m_max,uv_index_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FMazatlan&forecast_days=16`);
    if(!r.ok)throw 0;const j=await r.json();if(!j.daily)throw 0;LS.set('wx4',{daily:j.daily,hourly:j.hourly,current:j.current,saved:Date.now()});if(manual)toast('Forecast updated');if(state.mode==='list'&&state.tab!=='info')render()}
  catch(e){if(manual)toast('No connection. Showing the saved forecast')}
}
async function offlineStatus(){const el=$('#offl');if(!el)return;let t='';if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistration();t=r&&r.active?'✅ App saved for offline use':'⏳ Not saved yet. Keep it open for a few seconds on Wi-Fi'}else t='This browser can’t save the app offline';el.textContent=t}
addEventListener('online',()=>{refreshWx();refreshFx();if(state.mode==='map'){render();toast('Back online. Google Maps')}});
addEventListener('offline',()=>{if(state.mode==='map'){render();toast('Offline. Showing the sketch map')}});
setInterval(()=>{const c=$('#clock');if(c){const k=clockTxt();c.innerHTML=`<b>${k[0]}</b><span>${k[1]} · Todos Santos</span>`}const sc=$('#sunchip');if(sc&&isToday(state.day)){const s=sunTimes(dayObj().d),t=tsMinutes();sc.textContent=t<s.set?`🌅 ${fmt(s.set)} · ${dur(s.set-t)}`:`🌅 ${fmt(s.set)}`}},15000);
setInterval(()=>{applyTheme();if(state.mode==='list'&&state.tab!=='info'&&!$('#sheet').classList.contains('open')){const y=scrollY;const h=document.querySelector('.hero');if(h){const tmp=document.createElement('div');tmp.innerHTML=heroHtml();h.replaceWith(tmp.firstElementChild);const dz=document.querySelector('.days');if(dz&&tmp.children[0])dz.replaceWith(tmp.children[0]);scrollTo(0,y)}}},60000);

applyTheme();render();checkImport();addEventListener('hashchange',checkImport);
if(isToday('11/28')&&!LS.get('cf28',false)){LS.set('cf28',true);setTimeout(confetti,600)}
{const w=LS.get('wx4',null);if(navigator.onLine&&(!w||Date.now()-w.saved>30*60e3))refreshWx();const fx=LS.get('fx',null);if(navigator.onLine&&(!fx||Date.now()-fx.saved>12*3600e3))refreshFx()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
