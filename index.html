<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5f0" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Todos Santos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Todos Santos</title>
<style>
:root{
  --bg:#f8f5f0;--bg2:#efeae2;--ink:#1b1c1e;--mut:#6c6f73;--line:#e3ddd3;--chip:#ebe5dc;
  --acc:#ef5a3c;--sea:#168f9c;--good:#1f9d5a;--warn:#d9822b;--bad:#d2452b;
  --land:#efe9df;--seacol:#bfe0ea;--hdr:rgba(248,245,240,.93);--navbg:rgba(250,247,243,.96);
  --c-eat:#ef5a3c;--c-beach:#168f9c;--c-do:#7b5bd6;--c-night:#3b4cc0;--c-info:#5f6670;
  --t-eat:rgba(239,90,60,.12);--t-beach:rgba(22,143,156,.12);--t-do:rgba(123,91,214,.12);--t-night:rgba(59,76,192,.12);--t-info:rgba(95,102,112,.12);
}
html[data-theme=dark]{
  --bg:#0e1113;--bg2:#15191c;--ink:#eceae6;--mut:#979b9f;--line:#23282c;--chip:#1d2226;
  --acc:#ff7356;--sea:#4cc6d2;--good:#4fd18a;--warn:#f0a44f;--bad:#ff7a63;
  --land:#1a1e21;--seacol:#122a31;--hdr:rgba(14,17,19,.92);--navbg:rgba(20,24,27,.95);
  --c-eat:#ff7356;--c-beach:#4cc6d2;--c-do:#a58cf0;--c-night:#8a98ff;--c-info:#a3a9b0;
  --t-eat:rgba(255,115,86,.16);--t-beach:rgba(76,198,210,.16);--t-do:rgba(165,140,240,.16);--t-night:rgba(138,152,255,.16);--t-info:rgba(163,169,176,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--hdr);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:2px;position:relative}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:700;color:var(--mut);border-radius:8px;position:relative;z-index:1;cursor:pointer;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:left .25s cubic-bezier(.3,1.4,.5,1),width .25s}
.ib{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:16px}
/* hero weather */
.hero{position:relative;color:#fff;padding:18px 18px 12px;overflow:hidden;transition:background 1.2s}
.hero .place{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.hero .main{display:flex;align-items:center;gap:12px;margin-top:2px}
.hero .temp{font-size:72px;font-weight:200;letter-spacing:-.05em;line-height:1}
.hero .cond{font-size:18px;font-weight:600}
.hero .sub{font-size:14px;opacity:.9}
.hero .wxi{width:76px;height:76px;margin-left:auto;flex:none}
.hourly{display:flex;gap:16px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.25);margin-top:12px}
.hourly::-webkit-scrollbar{display:none}
.hourly div{flex:none;text-align:center;font-size:13px;min-width:34px}
.hourly b{display:block;font-size:15px;font-weight:600}
.hourly svg{width:26px;height:26px;display:block;margin:3px auto}
.chiprow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.hchip{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;white-space:nowrap}
.days{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:10px 12px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;border:0;background:none;padding:8px 10px 10px;font-size:14px;font-weight:600;color:var(--mut);position:relative;cursor:pointer}
.days button.on{color:var(--ink)}
.days button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px;background:var(--acc);animation:grow .3s ease}
.days .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:4px;vertical-align:middle}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
/* sections & rows */
main{max-width:720px;margin:0 auto}
.sec{padding:18px 16px 4px}
.sec h2{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sec .hint{font-size:13.5px;color:var(--mut);margin:0 0 4px}
.rows{border-top:1px solid var(--line)}
.r{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;animation:fadeUp .35s ease both;transition:background .15s}
.r:active{background:var(--bg2)}
.r .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.r .ic svg{width:21px;height:21px}
.r .tx{flex:1;min-width:0}
.r .nm{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .ln{font-size:13.5px;color:var(--mut);margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.r .rt{text-align:right;font-size:13px;color:var(--mut);flex:none}
.r .why{font-size:13.5px;color:var(--ink);opacity:.85;margin-top:2px}
.st{font-weight:600}
.st.open{color:var(--good)}.st.soon{color:var(--warn)}.st.closed{color:var(--bad)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px;box-shadow:0 0 0 0 rgba(31,157,90,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,90,.45)}70%{box-shadow:0 0 0 7px rgba(31,157,90,0)}100%{box-shadow:0 0 0 0 rgba(31,157,90,0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:6px;margin-right:4px;vertical-align:1px;background:var(--chip);color:var(--mut)}
.tag.q{color:var(--good)}.tag.w{color:var(--bad)}.tag.m{color:var(--sea)}.tag.s{color:var(--warn)}
.filters{display:flex;gap:6px;padding:10px 16px 2px;overflow-x:auto;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pinrow{border-left:3px solid var(--acc);background:var(--bg2)}
.note{padding:10px 16px;font-size:13.5px;color:var(--mut);border-bottom:1px solid var(--line)}
.kv{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.kv b{min-width:64px}
.btn{border:0;background:var(--chip);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff}
.btn.on{background:var(--sea);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea,input[type=text]{width:100%;font:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg2)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
label.l{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
.mut{color:var(--mut)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
/* tides */
.tide{padding:6px 16px 12px;border-bottom:1px solid var(--line)}
.tide svg{width:100%;height:84px;display:block}
.tide .path{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tide .wave{animation:wave 4s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(1.5px)}}
.tlist{display:flex;justify-content:space-between;font-size:13px;margin-top:4px}
.tlist div{text-align:center}.tlist b{display:block;font-size:14px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--navbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:10.5px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;transition:color .2s}
nav button svg{width:24px;height:24px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
nav button.on{color:var(--acc)}
nav button.on svg{transform:translateY(-2px) scale(1.08)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2.5px;border-radius:0 0 3px 3px;background:var(--acc);animation:grow .3s ease}
/* map */
.mapwrap{position:fixed;left:0;right:0;top:var(--toph,56px);bottom:calc(57px + env(safe-area-inset-bottom));z-index:10}
.tmap{position:absolute;inset:0;overflow:hidden;background:var(--land);touch-action:none;user-select:none;-webkit-user-select:none}
.tmap .base,.tmap .tiles,.tmap .pins{position:absolute;inset:0}
.tmap .base{width:100%;height:100%}
.tile{position:absolute;left:0;top:0;opacity:0;transition:opacity .3s;pointer-events:none;-webkit-user-drag:none;transform-origin:0 0}
.tile.ok{opacity:1}.tile.bad{display:none}
html[data-theme=dark] .tile.fb{filter:invert(.92) hue-rotate(180deg) brightness(.9) contrast(.9)}
.pin{position:absolute;left:0;top:0;cursor:pointer}
.pin .pb{position:absolute;left:-15px;top:-38px;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff;animation:drop .5s cubic-bezier(.3,1.5,.6,1) both}
.pin .pb svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin .lbl{position:absolute;left:12px;top:-34px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 3px var(--bg);pointer-events:none}
.pin.sel .pb{transform:rotate(-45deg) scale(1.25);transition:transform .2s}
.pin .fav{position:absolute;left:6px;top:-44px;font-size:12px}
@keyframes drop{0%{opacity:0;transform:translateY(-30px) rotate(-45deg)}60%{opacity:1}100%{transform:rotate(-45deg)}}
.me{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 0 0 0 rgba(66,133,244,.4);animation:mepulse 2s infinite}
@keyframes mepulse{0%{box-shadow:0 0 0 0 rgba(66,133,244,.45)}70%{box-shadow:0 0 0 14px rgba(66,133,244,0)}100%{box-shadow:0 0 0 0 rgba(66,133,244,0)}}
.mctl{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:8px;z-index:5}
.mctl button{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:20px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.mctl button.g{font-size:13px;font-weight:800;color:#4285f4}
.mtop{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;z-index:5;overflow-x:auto;scrollbar-width:none}
.mtop button,.mtop .wxp{flex:none;border:0;background:var(--bg);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.mtop button.on{background:var(--ink);color:var(--bg)}
.mtop svg{width:18px;height:18px}
.attr{position:absolute;left:6px;bottom:4px;font-size:10px;color:#555;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px;z-index:5}
.gwrap{position:absolute;inset:0;z-index:8;background:var(--bg);display:none}
.gwrap.on{display:block}
.gwrap iframe{width:100%;height:100%;border:0}
.gwrap .back{position:absolute;left:12px;top:12px;z-index:2}
/* sheet */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility .32s;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#sheet.open{transform:none;visibility:visible}
#sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
#sheet h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
#sheet .hl{border-top:1px solid var(--line);margin:14px -18px 0;padding:12px 18px 0}
.starbtn.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:none}}
.burst{position:fixed;pointer-events:none;z-index:60;width:6px;height:6px;border-radius:50%;animation:burst .6s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;z-index:70;opacity:0;transition:all .25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
/* weather icon animation */
.spin{transform-origin:12px 12px;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drift{animation:drift 6s ease-in-out infinite}
@keyframes drift{50%{transform:translateX(1.2px)}}
.rain line{animation:rain 1.2s linear infinite}
.rain line:nth-child(2){animation-delay:.4s}.rain line:nth-child(3){animation-delay:.8s}
@keyframes rain{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(4px);opacity:0}}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="top" id="top"><h1 id="title">Eat</h1><div class="seg" id="seg"><span class="thumb"></span><button data-act="mode" data-k="list">List</button><button data-act="mode" data-k="map">Map</button></div><button class="ib" id="themeBtn" data-act="theme" aria-label="Theme"></button></div>
<main id="app"><div class="sec"><h2>Loading your trip…</h2><p class="hint">If this doesn’t change in a few seconds, <a href="#" onclick="resetApp();return false">tap here to reset the app</a>.</p></div></main>
<div id="scrim"></div>
<div id="sheet"></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<nav id="nav"></nav>

<script>
try{localStorage.removeItem('wx');localStorage.removeItem('wx3')}catch(e){}
function resetApp(){
  try{localStorage.removeItem('tab')}catch(e){}
  var done=function(){location.replace(location.pathname+'?r='+Date.now())};
  var jobs=[];
  if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
  if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('tiles')<0}).map(function(k){return caches.delete(k)}))}));
  Promise.all(jobs).then(done,done);
}
window.onerror=function(msg,src,line){
  var el=document.getElementById('app');
  if(el)el.innerHTML='<div class="sec"><h2>Something went wrong</h2><p class="small">'+String(msg).replace(/</g,'&lt;')+' (line '+line+')</p><p><button class="btn pri" onclick="resetApp()">Reset &amp; reload</button></p><p class="mut small">Your notes and photos are kept. Screenshot this and send it to Claude if it keeps happening.</p></div>';
};
</script>

function sunTimes(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const n=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/864e5),g=2*Math.PI/365*(n-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));

function fmt(min){min=Math.round(min);let h=Math.floor(min/60)%24,m=min%60;const ap=h>=12?'pm':'am';h=h%12||12;return m?h+':'+String(m).padStart(2,'0')+' '+ap:h+' '+ap}
function fmtc(min){min=Math.round(min);let h=Math.floor(min/60)%24,m=min%60;h=h%12||12;return h+':'+String(m).padStart(2,'0')}

function km(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

 {id:'caffe',t:'eat',n:'Caffe Todos Santos',lat:23.44844,lon:-110.22604,phone:'+526121450789',pid:'ChIJlysreKgGr4YRi7xyrfPblh0',hours:H('7 am–3 pm','7 am–3 pm','7 am–3 pm','7 am–3 pm',null,'7 am–3 pm','7 am–3 pm'),d:'Breakfast courtyard steps from the hotel. Huge cinnamon buns, good coffee with refills, and decaf.'},
 {id:'jazacafe',t:'eat',n:'Jazamango Café',lat:23.45070,lon:-110.22384,phone:'+526121074464',pid:'ChIJeYuN0xIHr4YRntTIqQ0GKak',hours:H('8:10 am–3 pm','8:10 am–3 pm',null,'8:10 am–3 pm','8:10 am–3 pm','8:10 am–3 pm','8:10 am–3 pm'),d:'Calm downtown brunch café with a bakery across the way. Try the corn cakes.'},
 {id:'agricole',t:'eat',n:'Cocina de Campo by Agricole',lat:23.37856,lon:-110.18162,phone:'+526122173734',pid:'ChIJ1YiJlKIFr4YRS5CL5cXDCAo',hours:H('8 am–8 pm','8 am–8 pm','1–8 pm','1–8 pm','8 am–8 pm','8 am–8 pm','8 am–8 pm'),quiet:true,d:'A farm in El Pescadero with a garden restaurant, deli, bakery and market. Wood-fired pizza and beet salad. Reviewers mention live music on weekend afternoons.'},
 {id:'hierba',t:'eat',n:'Hierbabuena',lat:23.36291,lon:-110.18152,phone:'+526121492568',pid:'ChIJMQW8W9Mar4YRHPM_B-Rr-oo',hours:H('1–9 pm','3–9 pm',null,'3–9 pm','3–9 pm','3–9 pm','3–9 pm'),quiet:true,d:'Farm-to-table dinner in the middle of the farm it comes from. Catch of the day with green mole, and oven pizzas. Closed Tuesdays.'},

 {id:'miguel',t:'eat',n:'Carnitas Miguel’s',lat:23.36784,lon:-110.17425,phone:'+526242304357',pid:'ChIJFa8-18war4YRS7h2ZRNDErw',hours:D('8 am–9 pm'),quiet:true,d:'Roadside carnitas on Hwy 19 in Pescadero. Order by the taco or by weight. Cheap, fast and local.'},
 {id:'beans',t:'eat',n:'Baja Beans (Pescadero original)',lat:23.36151,lon:-110.17345,phone:'+526121303391',pid:'ChIJUXrrDnuPr4YRtoixT_kpP7A',hours:D('7 am–2 pm'),quiet:true,d:'Local roaster with a garden patio, pour-overs and brunch. On Sunday mornings, market vendors set up around it.'},
 {id:'green',t:'eat',n:'The Green Room',lat:23.49130,lon:-110.27766,phone:'+526122170031',pid:'ChIJnVCn_wIEr4YRfzGhfdaT17M',hours:D('1–10 pm'),dirt:true,sunset:true,d:'Tables right in the sand at La Pastora. The classic sunset dinner, with smoked marlin and tuna tostadas. Service is slow, so arrive before sunset. Part of the road is unpaved.'},
 {id:'chava',t:'eat',n:'El Compa Chava',quiet:true,d:'Cheap, cheerful ceviche (fish, shrimp, octopus) recommended by locals. Not on the map, so ask in town or look it up when you have signal.'},
 // BEACH
 {id:'cachora',t:'beach',n:'Playa La Cachora',lat:23.44304,lon:-110.24128,pid:'ChIJtzntnv4Dr4YRYBXTwuv0-cM',dirt:true,quiet:true,sunset:true,d:'Close to town and nearly empty. Reviewers report seeing whales from the sand. The road in is narrow, bumpy and sandy. Big waves, so it isn’t for swimming.'},
 {id:'lobos',t:'beach',n:'Punta Lobos',lat:23.41427,lon:-110.23133,pid:'ChIJJyqVTsGpr4YR0GT0MN1TlMo',quiet:true,sunset:true,d:'Fishermen launch pangas here, and around dusk you can buy fish right off the boats. Yellow chapel, and the trailhead for the Old Port hike. Steep beach with strong rips, so don’t swim.'},

 {id:'pedrito',t:'beach',n:'Playa San Pedrito',lat:23.376,lon:-110.201,approx:true,dirt:true,quiet:true,sunset:true,d:'Long, mostly empty beach just north of Rancho Pescadero. Good for walks and sunset. Map pin is approximate. Pacific currents, so wade only.'},

 {id:'oldport',t:'do',n:'Old Port hike (from Punta Lobos)',lat:23.4135,lon:-110.2300,approx:true,quiet:true,d:'About 4 miles, starting behind the yellow chapel on Punta Lobos beach. Go in the morning or well before dark. Bring water. The app’s map works offline, but download a Google Maps offline area too.'},
 {id:'plaza',t:'do',n:'Plaza, mission and galleries',lat:23.44861,lon:-110.22333,d:'A 5–10 minute walk from the hotel. Mission church, theater, galleries and Hotel California nearby. Best in the cool morning or at golden hour.'},

 {id:'whale',t:'do',n:'Whale watching (early season)',d:'You’re here at the very start of the season, so sightings are possible but not guaranteed. Watch from La Cachora or Punta Lobos, or ask Eco Adventures about a boat.'},
 {id:'turtles',t:'do',n:'Baby turtle release · Tortugueros Las Playitas',lat:23.46529,lon:-110.25666,phone:'+526122192650',pid:'ChIJFSEPAUEBr4YR6diNLhe8_ck',hours:D('5–7 pm'),quiet:true,sunset:true,dirt:true,d:'Volunteer sea-turtle hatchery on the beach north of town. When babies have hatched, they release them at sunset, often with whales spouting offshore. Sources differ on whether releases start mid-November or in December, so call or ask first. Free, donations welcome.'},
 {id:'turtles2',t:'do',n:'Release a hatchling · Grupo Tortuguero',lat:23.44636,lon:-110.24434,phone:'+526122034192',pid:'ChIJtbSDOvwDr4YRdbjfTYQgeos',quiet:true,dirt:true,d:'Smaller turtle group at Playa La Máquina, close to town. Visitors have released a hatchling themselves for about 150 pesos per person in cash, around 4:30 pm. Call first to make sure a release is happening.'},
 {id:'whaleshark',drive:'About 1 h 10 min drive',t:'do',n:'Swim with whale sharks · La Paz',lat:24.1546,lon:-110.3253,approx:true,d:'The big day trip. Whale sharks feed in La Paz Bay roughly November to April. Authorities open the season in mid to late November and assign operating days, so book ahead and keep a backup day. Tour shops cluster on Calle Topete (La Paz Whale Shark VIP, Tuna Tuna, MeXplore). Skip sunscreen in the water.'},
 {id:'malecon',drive:'About 1 h 10 min drive',t:'do',n:'La Paz malecón at sunset',lat:24.15539,lon:-110.32272,pid:'ChIJJ2HXcVHTr4YRegW5uc0cFCI',d:'Long waterfront promenade on the Sea of Cortez with sculptures, street food and a real local evening crowd. Pairs well with the whale sharks. Remember the drive back on Hwy 19 is in the dark.'},

 {id:'triunfo',drive:'About 1 h drive',t:'do',n:'El Triunfo mining town',lat:23.80213,lon:-110.10850,pid:'ChIJBdi3WxG7r4YR9Lx48YY5IdU',hours:H('10 am–5 pm','10 am–5 pm',null,'10 am–5 pm','10 am–5 pm','10 am–5 pm','10 am–5 pm'),quiet:true,d:'19th-century silver town about an hour inland. La Ramona smokestack, the Ruta de Plata mining museum (closed Tuesdays), a quirky music museum and a newer cowboy museum. Lunch at El Minero.'},

 {id:'pastora',t:'beach',n:'Playa La Pastora',lat:23.48839,lon:-110.27609,pid:'ChIJI1APXvoFr4YRmdnSGIogu7g',quiet:true,sunset:true,dirt:true,d:'Big, nearly empty surf beach north of town near The Green Room. Locals call it one of the best sunsets around, and you might spot whales. Not for swimming.'},

const mapState={el:null,lat:LS.get('mapc',[23.43,-110.212])[0],lon:LS.get('mapc',[23.43,-110.212])[1],z:LS.get('mapz',12.2),tiles:new Map(),raf:0,pins:[],moved:false};

function miniWx(){const w=wxData(),d=dayObj();let tx='';if(w){const i=w.daily.time.indexOf(d.d);if(i>=0&&w.daily.temperature_2m_max&&w.daily.temperature_2m_max[i]!=null){const c=w.current&&isToday(d.k)?w.current:null;tx=Math.round(c&&c.temperature_2m!=null?c.temperature_2m:w.daily.temperature_2m_max[i])+'°'}}const s=sunTimes(d.d);return `${tx?tx+' · ':''}🌅 ${fmt(s.set)}`}

function worldSize(){return 256*Math.pow(2,mapState.z)}
function mapRender(){
  mapState.raf=0;const el=mapState.el;if(!el||!document.body.contains(el))return;
  const W=el.clientWidth,H=el.clientHeight,z=mapState.z,ws=worldSize();
  const cx=mx(mapState.lon)*ws,cy=my(mapState.lat)*ws,left=cx-W/2,top=cy-H/2;
  const zi=Math.max(3,Math.min(ZMAX,Math.round(z))),n=1<<zi,sc=Math.pow(2,z-zi),ts=256*sc;
  const x0=Math.floor(left/ts),x1=Math.floor((left+W)/ts),y0=Math.max(0,Math.floor(top/ts)),y1=Math.min(n-1,Math.floor((top+H)/ts));
  const need=new Set(),dark=isDark(),layer=$('#ttiles');
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){

    if(!mapState.tiles.has(key)){const im=new Image();im.className='tile';im.alt='';im.dataset.z=zi;im.dataset.x=x;im.dataset.y=y;
      im.onload=()=>{im.classList.add('ok');schedule()};
      im.onerror=()=>{if(dark&&!im.dataset.fb){im.dataset.fb='1';im.classList.add('fb');im.src=tileUrl(zi,x,y,false)}else im.classList.add('bad');schedule()};
      im.src=tileUrl(zi,x,y,dark);layer.appendChild(im);mapState.tiles.set(key,im)}
  }

  for(const [k,im] of mapState.tiles){
    const tz=+im.dataset.z,s2=Math.pow(2,z-tz),sz=256*s2;
    if(tz===zi&&!need.has(k)){im.remove();mapState.tiles.delete(k);continue}

    im.style.width=im.style.height=Math.ceil(sz)+1+'px';im.style.transform=`translate(${(im.dataset.x*sz-left).toFixed(1)}px,${(im.dataset.y*sz-top).toFixed(1)}px)`;im.style.zIndex=tz===zi?2:1;
  }

  const P2=([la,lo])=>[(mx(lo)*ws-left).toFixed(1),(my(la)*ws-top).toFixed(1)];
  const c=COAST.map(P2);
  $('#tbase').innerHTML=`<path d="M-2000,-2000 L${c[0][0]},-2000 ${c.map(p=>'L'+p.join(',')).join(' ')} L${c[c.length-1][0]},${H+2000} L-2000,${H+2000}Z" fill="var(--seacol)"/><path d="M${ROAD.map(P2).map(p=>p.join(',')).join(' L')}" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>`;
  for(const pin of mapState.pins){const X=mx(pin.p.lon)*ws-left,Y=my(pin.p.lat)*ws-top;pin.el.style.transform=`translate(${X.toFixed(1)}px,${Y.toFixed(1)}px)`;pin.el.style.display=(X<-60||X>W+60||Y<-60||Y>H+60)?'none':'';pin.lbl.style.display=(z>=14.6||pin.p.id==='hotel'||pin.p.id===state.sel)?'':'none'}
  const me=$('#tme');if(me){const g=state.gps;if(g){me.className='me';me.style.position='absolute';me.style.transform=`translate(${(mx(g.lon)*ws-left).toFixed(1)}px,${(my(g.lat)*ws-top).toFixed(1)}px)`}else me.className=''}
  LS.set('mapc',[mapState.lat,mapState.lon]);LS.set('mapz',mapState.z);
}
function schedule(){if(gm)gmMeUpdate();if(!mapState.raf)mapState.raf=requestAnimationFrame(mapRender)}
function mapPins(keepAnim){
  if(gm)gmPins();
  const layer=$('#tpins');if(!layer)return;layer.innerHTML='';mapState.pins=[];
  const list=PLACES.filter(p=>p.lat!=null&&(state.allPins||p.t===state.tab||p.id==='hotel'));
  list.forEach((p,i)=>{const el=document.createElement('div');el.className='pin'+(p.id===state.sel?' sel':'');el.dataset.act='open';el.dataset.id=p.id;
    const col=p.id==='hotel'?'var(--acc)':`var(--c-${p.t})`;
    el.innerHTML=`<div class="pb" style="background:${col};${keepAnim?'animation:none':`animation-delay:${Math.min(i*40,600)}ms`}">${iconFor(p)}</div>${favs.has(p.id)?'<span class="fav">⭐</span>':''}<div class="lbl">${esc(p.n.replace(/\s*\(.*\)/,''))}</div>`;
    layer.appendChild(el);mapState.pins.push({p,el,lbl:el.querySelector('.lbl')})});
  schedule();
}
function panBy(dx,dy){const ws=worldSize();mapState.lon=ilon(mx(mapState.lon)-dx/ws);mapState.lat=ilat(my(mapState.lat)-dy/ws);clampMap();schedule()}
function clampMap(){mapState.lat=Math.max(23.1,Math.min(24.4,mapState.lat));mapState.lon=Math.max(-110.6,Math.min(-109.8,mapState.lon))}
function zoomAt(dz,px,py){
  const el=mapState.el;const W=el.clientWidth,H=el.clientHeight;const ws=worldSize();
  const ux=mx(mapState.lon)+(px-W/2)/ws,uy=my(mapState.lat)+(py-H/2)/ws;
  mapState.z=Math.max(ZMIN,Math.min(ZMAX,mapState.z+dz));const ws2=worldSize();
  mapState.lon=ilon(ux-(px-W/2)/ws2);mapState.lat=ilat(uy-(py-H/2)/ws2);clampMap();schedule();
}
let anim=0;
function animate(fn,ms){cancelAnimationFrame(anim);const t0=performance.now();let last=0;const step=t=>{const k=Math.min(1,(t-t0)/ms);const e=1-Math.pow(1-k,3);fn(e-last,e);last=e;if(k<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function zoomAnim(dz,px,py){if(gm){gm.setZoom(gm.getZoom()+Math.sign(dz));return}const el=mapState.el;if(px==null){px=el.clientWidth/2;py=el.clientHeight/2}animate(d=>zoomAt(dz*d,px,py),280)}
function flyTo(lat,lon,z){if(gm){gm.panTo({lat,lng:lon});gm.setZoom(Math.round(z));return}const a={lat:mapState.lat,lon:mapState.lon,z:mapState.z};animate((d,e)=>{mapState.lat=a.lat+(lat-a.lat)*e;mapState.lon=a.lon+(lon-a.lon)*e;mapState.z=a.z+(z-a.z)*e;schedule()},650)}
function bindMapGestures(el){
  const pts=new Map();let lastD=0,lastMid=null,vel={x:0,y:0},lastMove=0,startPt=null,lastTap=0;
  el.addEventListener('pointerdown',e=>{cancelAnimationFrame(anim);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){mapState.moved=false;startPt={x:e.clientX,y:e.clientY};vel={x:0,y:0}}lastD=0;lastMid=null});
  el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(!mapState.moved&&Math.hypot(e.clientX-startPt.x,e.clientY-startPt.y)>5){mapState.moved=true;try{el.setPointerCapture(e.pointerId)}catch(_){}}
      if(mapState.moved){panBy(dx,dy);const now=performance.now(),dt=Math.max(1,now-lastMove);vel={x:dx/dt*16,y:dy/dt*16};lastMove=now}}
    else if(pts.size===2){mapState.moved=true;const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const r=el.getBoundingClientRect();
      if(lastD){zoomAt(Math.log2(d/lastD),mid.x-r.left,mid.y-r.top);panBy(mid.x-lastMid.x,mid.y-lastMid.y)}lastD=d;lastMid=mid}});
  const up=e=>{const was=pts.size;pts.delete(e.pointerId);if(pts.size<2){lastD=0;lastMid=null}
    if(was===1&&mapState.moved&&performance.now()-lastMove<80&&Math.hypot(vel.x,vel.y)>1){let v={...vel};const step=()=>{v.x*=0.92;v.y*=0.92;panBy(v.x,v.y);if(Math.hypot(v.x,v.y)>0.3)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
    if(was===1&&!mapState.moved&&!e.target.closest('.pin')){const now=performance.now();if(now-lastTap<300){const r=el.getBoundingClientRect();zoomAnim(1,e.clientX-r.left,e.clientY-r.top);lastTap=0}else lastTap=now}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('click',e=>{if(mapState.moved){e.stopPropagation();e.preventDefault()}},true);
  el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect();zoomAt(-e.deltaY*0.003,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  addEventListener('resize',schedule);
}
const FLY={town:[23.4473,-110.2245,15.6],pesc:[23.372,-110.18,13.6],all:[23.42,-110.215,11.9]};
let gpsWatch=null;
function startGps(center){
  if(!('geolocation' in navigator)){toast('Location isn’t available');return}
  if(gpsWatch==null)gpsWatch=navigator.geolocation.watchPosition(p=>{const first=!state.gps;state.gps={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};schedule();if(first&&center)goMe()},()=>toast('Couldn’t get your location'),{enableHighAccuracy:true,maximumAge:15000});
  else if(center)goMe();
}
function goMe(){const g=here();if(g)flyTo(g.lat,g.lon,Math.max(mapState.z,15));else if(state.gps)toast(`You’re ${Math.round(km(state.gps,HOTEL))} km from the hotel. Outside the map area`)}
function googleView_unused(lat,lon,z,label){
  if(!navigator.onLine){toast('Google Maps needs signal');return}
  const q=label?`${lat},${lon}(${label})`:`${lat},${lon}`;
  $('#gframe').src=`https://maps.google.com/maps?q=${encodeURIComponent(q)}&z=${Math.round(z)}&output=embed`;$('#gwrap').classList.add('on');
}
/* offline tile download */
function lon2t(lon,z){return Math.floor(mx(lon)*(1<<z))}function lat2t(lat,z){return Math.floor(my(lat)*(1<<z))}
async function saveTiles(){
  const jobs=[];const add=(la0,la1,lo0,lo1,z0,z1)=>{for(let z=z0;z<=z1;z++)for(let x=lon2t(lo0,z);x<=lon2t(lo1,z);x++)for(let y=lat2t(la1,z);y<=lat2t(la0,z);y++)jobs.push(tileUrl(z,x,y,false))};
  add(23.30,23.52,-110.31,-110.14,10,14);add(23.32,23.50,-110.29,-110.16,15,15);add(23.437,23.456,-110.235,-110.212,16,17);add(23.36,23.385,-110.19,-110.17,16,16);
  const st=$('#tileStatus');let done=0,fail=0;const N=jobs.length;
  if(!navigator.onLine){toast('Connect to Wi-Fi first');return}
  const worker=async()=>{while(jobs.length){const u=jobs.shift();try{await fetch(u,{mode:'no-cors'})}catch(e){fail++}done++;if(st&&done%10===0)st.textContent=`Saving… ${Math.round(done/N*100)}%`}};
  await Promise.all([1,2,3,4,5,6].map(worker));
  LS.set('tilesSaved',Date.now());if($('#tileStatus'))$('#tileStatus').textContent=fail?`Saved with ${fail} gaps. Try again on better Wi-Fi`:'✅ Saved just now. The map works offline';toast(fail?'Map saved (some gaps)':'Map saved for offline');burst($('[data-act=savetiles]')||document.body);
}

/* ================= render ================= */
function setSeg(){const seg=$('#seg');const b=seg.querySelector(`[data-k=${state.mode}]`);seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));const th=seg.querySelector('.thumb');th.style.left=b.offsetLeft+'px';th.style.width=b.offsetWidth+'px'}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,k=el.dataset.k,id=el.dataset.id;
  if(a==='photo'||a==='memo')return;
  if(a==='tab'){if(state.tab===k&&state.mode==='list'){scrollTo({top:0,behavior:'smooth'});return}state.tab=k;closeSheet();render();scrollTo(0,0)}
  else if(a==='mode'){if(state.mode===k)return;state.mode=k;closeSheet();render();scrollTo(0,0)}
  else if(a==='day'){state.day=k;render();if(k==='11/28'&&!window._cf){window._cf=1;confetti()}}
  else if(a==='quiet'){state.quiet=el.dataset.v==='1';render()}
  else if(a==='open')openSheet(id);
  else if(a==='fav'||a==='done'){const s=a==='fav'?favs:done;const on=!s.has(id);on?s.add(id):s.delete(id);LS.set(a==='fav'?'favs':'done',[...s]);if(on)burst(el);openSheet(id);const b=$('#sheet [data-act=fav]');if(a==='fav'&&b)b.classList.add('pop');if(state.mode==='list')render()}
  else if(a==='showmap'){const p=P[id];closeSheet();state.tab=p.t;state.mode='map';mapState.lat=p.lat;mapState.lon=p.lon;mapState.z=Math.max(15,mapState.z);render();state.sel=id;mapPins(true)}
    else if(a==='gmap'){
    if(gm){LS.set('mapProv','offline');toast('Offline map');render()}
    else if(gkey()){if(!navigator.onLine){toast('Google Maps needs signal');return}LS.set('mapProv','google');toast('Google Maps');render()}
    else{toast('Add a Google key in Info to show Google Maps here');window.open(`https://www.google.com/maps/@${mapState.lat},${mapState.lon},${Math.round(mapState.z)}z`,'_blank')}}
  else if(a==='pins'){state.allPins=el.dataset.v==='1';document.querySelectorAll('[data-act=pins]').forEach(b=>b.classList.toggle('on',b===el));mapPins(false)}
  else if(a==='fly'){const f=FLY[k];flyTo(f[0],f[1],f[2])}
  else if(a==='zin'||a==='zout')zoomAnim(a==='zin'?1:-1);
  else if(a==='gps'){LS.set('gpsOk',true);startGps(true)}
  else if(a==='theme'){const i=THEMES.indexOf(themeMode());LS.set('theme2',THEMES[(i+1)%THEMES.length]);applyTheme();toast({auto:'Theme follows your phone/browser',light:'Light',dark:'Dark',sunset:'Dark after sunset'}[themeMode()]);if(state.tab==='info'&&state.mode==='list')render()}
  else if(a==='save'){['tides','music','resv','notes'].forEach(x=>LS.set(x,$('#e-'+x).value));toast('Saved')}
  else if(a==='reset'){if(confirm('Replace tides, music and reservations with the built-in versions?')){['tides','music','resv'].forEach(LS.del);render();toast('Reset')}}
  else if(a==='wx')refreshWx(true);
  else if(a==='savetiles')saveTiles();
  else if(a==='savekey'){LS.set('gkey',$('#gkeyIn').value.trim());LS.set('mapProv','google');gmLoading=null;toast(gkey()?'Key saved. Map will use Google when online':'Key removed');render()}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.act==='memo'){const m=LS.get('memo',{});m[el.dataset.k]=el.value;LS.set('memo',m)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.act==='photo')addPhotos(el.files,el.dataset.k)});

/* ================= confetti ================= */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#ef5a3c','#f5b400','#168f9c','#7b5bd6','#ff8fb1'];const ps=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();const step=t=>{x.clearRect(0,0,innerWidth,innerHeight);for(const p of ps){p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-(t-t0)/2400);x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}if(t-t0<2400)requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight)};requestAnimationFrame(step);
}

/* ================= photos ================= */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open('ts-trip',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true}).createIndex('day','day');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function addPhotos(files,day){for(const f of files){try{const url=await shrink(f);const d=await db();await new Promise((res,rej)=>{const tx=d.transaction('photos','readwrite');tx.objectStore('photos').add({day,data:url,t:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){toast('Couldn’t save that photo')}}loadPhotos(day);toast('Photo saved')}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82))};img.onerror=rej;img.src=u})}
async function loadPhotos(day){const el=document.getElementById('ph-'+day.replace('/','-'));if(!el)return;try{const d=await db();const rows=await new Promise(res=>{const out=[];d.transaction('photos').objectStore('photos').index('day').openCursor(IDBKeyRange.only(day)).onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue()}else res(out)}});el.innerHTML=rows.map(r=>`<img src="${r.data}" alt="" data-pid="${r.id}">`).join('');el.querySelectorAll('img').forEach(im=>im.onclick=()=>{if(confirm('Delete this photo?'))delPhoto(+im.dataset.pid,day)})}catch(e){}}
async function delPhoto(id,day){const d=await db();d.transaction('photos','readwrite').objectStore('photos').delete(id);setTimeout(()=>loadPhotos(day),200)}

/* ================= weather & offline ================= */
async function refreshWx(manual){
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,wind_speed_10m_max,uv_index_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FMazatlan&forecast_days=16`);
    if(!r.ok)throw 0;const j=await r.json();if(!j.daily)throw 0;LS.set('wx4',{daily:j.daily,hourly:j.hourly,current:j.current,saved:Date.now()});if(manual)toast('Forecast updated');if(state.mode==='list'&&state.tab!=='info')render()}
  catch(e){if(manual)toast('No connection. Showing the saved forecast')}
}
async function offlineStatus(){const el=$('#offl');if(!el)return;let t='';if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistration();t=r&&r.active?'✅ App saved for offline use':'⏳ Not saved yet. Keep it open for a few seconds on Wi-Fi'}else t='This browser can’t save the app offline';el.textContent=t}

applyTheme();render();
if(isToday('11/28')&&!LS.get('cf28',false)){LS.set('cf28',true);setTimeout(confetti,600)}
{const w=LS.get('wx4',null);if(navigator.onLine&&(!w||Date.now()-w.saved>2*3600e3))refreshWx()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
